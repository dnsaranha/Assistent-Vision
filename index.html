<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Voice Assistant</title>
    <meta name="description" content="An AI assistant that can see your screen and respond to your voice or text commands, helping you with tasks and answering questions about what's on your display." />
    <meta property="og:title" content="Visual Voice Assistant" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6126430337763636" crossorigin="anonymous"></script>

<style>
  html, body, #root {
    height: 100%;
    max-height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  @keyframes pulse-slow {
    50% {
      opacity: .7;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3);
    }
  }
  .animate-pulse-slow {
    animation: pulse-slow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in {
    animation: fadeIn 0.25s ease-out forwards;
  }
</style>
</head>
  <body class="bg-gray-900 text-gray-200 antialiased overflow-hidden select-none">
    <div id="root" class="h-full w-full overflow-hidden flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
