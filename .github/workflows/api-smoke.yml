name: Production API smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/vercel-api-server-esm-import

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Wait for Vercel Preview and verify API health
        env:
          HEALTH_URL: https://assistent-vision-5u0yho226-denis-nascimento-aranhas-projects.vercel.app/api/health
        run: |
          for attempt in $(seq 1 18); do
            response=$(curl --silent --show-error --fail "$HEALTH_URL" 2>/dev/null || true)
            if [ -n "$response" ] && echo "$response" | grep -q '"status":"ok"'; then
              echo "API health check passed: $response"
              exit 0
            fi
            echo "Preview not ready yet (attempt $attempt/18)"
            sleep 10
          done
          echo "API health check did not return status=ok"
          exit 1
