<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Monitor Shape -->
  <g filter="url(#shadow)">
    <!-- Screen border -->
    <rect x="80" y="88" width="352" height="248" rx="28" fill="#1e293b" stroke="url(#glow)" stroke-width="12"/>
    <!-- Screen display -->
    <rect x="96" y="104" width="320" height="216" rx="18" fill="#0f172a"/>
    <!-- Stand -->
    <path d="M224 336 L208 408 L304 408 L288 336 Z" fill="url(#glow)"/>
    <!-- Base -->
    <rect x="176" y="408" width="160" height="20" rx="10" fill="url(#glow)"/>

    <!-- Eye / Vision & AI Sparkle inside screen -->
    <circle cx="256" cy="212" r="54" fill="#0f172a" stroke="#06b6d4" stroke-width="8"/>
    <circle cx="256" cy="212" r="26" fill="url(#glow)"/>
    <circle cx="266" cy="202" r="8" fill="#ffffff"/>

    <!-- Step / guide indicators -->
    <circle cx="132" cy="144" r="14" fill="#f59e0b"/>
    <text x="132" y="149" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <path d="M152 144 L196 168" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <circle cx="208" cy="174" r="14" fill="#10b981"/>
    <text x="208" y="179" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  </g>
</svg>
